name: Build SparkVisuals Android companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SparkVisualsApp/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        working-directory: SparkVisualsApp
        run: gradle --no-daemon clean assembleDebug
      - name: Verify and checksum APK
        run: |
          set -euo pipefail
          APK="SparkVisualsApp/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/SparkVisuals-0.2.0-debug.apk
          sha256sum dist/SparkVisuals-0.2.0-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkVisuals-0.2.0-debug
          path: dist/SparkVisuals-0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish APK as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build-${{ github.run_number }}
          name: SparkVisuals Android build ${{ github.run_number }}
          body: |
            Automated debug APK build.
            This is the current Android companion app, not an in-game client.
          files: dist/SparkVisuals-0.2.0-debug.apk
          fail_on_unmatched_files: true
