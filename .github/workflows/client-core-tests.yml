name: Standalone client core tests
on:
  push:
    paths: ['client/**', '.github/workflows/client-core-tests.yml']
  pull_request:
    paths: ['client/**', '.github/workflows/client-core-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run client core tests
        run: cargo test --workspace --manifest-path client/Cargo.toml
