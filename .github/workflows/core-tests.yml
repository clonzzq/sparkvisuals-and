name: SparkVisuals Core Tests

on:
  push:
    branches:
      - sparkvisuals-core-foundation
    paths:
      - 'sparkvisuals-core/**'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'sparkvisuals-core/**'
      - '.github/workflows/core-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sparkvisuals-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run core tests
        run: gradle --no-daemon test
