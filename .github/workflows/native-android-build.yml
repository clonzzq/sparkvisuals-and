name: Native Android mod build
on:
  push:
    paths:
      - "SparkVisualsNative/**"
      - ".github/workflows/native-android-build.yml"
  pull_request:
    paths:
      - "SparkVisualsNative/**"
      - ".github/workflows/native-android-build.yml"
  workflow_dispatch:
jobs:
  arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure Android ARM64 native module
        run: |
          cmake -S SparkVisualsNative -B build/native-arm64 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared -DBUILD_TESTING=OFF
      - name: Compile shared library
        run: cmake --build build/native-arm64 --parallel
      - name: Package preload-native mod
        run: |
          mkdir -p build/package/SparkVisuals
          cp SparkVisualsNative/manifest.json build/package/SparkVisuals/
          cp build/native-arm64/libSparkVisuals.so build/package/SparkVisuals/
          cd build/package
          zip -r SparkVisuals-arm64.zip SparkVisuals
          mv SparkVisuals-arm64.zip ../../SparkVisualsNative/dist/SparkVisuals-arm64.zip
      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: SparkVisuals-native-arm64
          path: SparkVisualsNative/dist/SparkVisuals-arm64.zip
          retention-days: 7
