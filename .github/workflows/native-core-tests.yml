name: Native core tests
on:
  push:
    paths:
      - "SparkVisualsNative/core/**"
      - "SparkVisualsNative/tests/**"
      - "SparkVisualsNative/CMakeLists.txt"
      - ".github/workflows/native-core-tests.yml"
  pull_request:
    paths:
      - "SparkVisualsNative/core/**"
      - "SparkVisualsNative/tests/**"
      - "SparkVisualsNative/CMakeLists.txt"
      - ".github/workflows/native-core-tests.yml"
  workflow_dispatch:
jobs:
  markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S SparkVisualsNative -B build/markers -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build/markers --parallel
      - name: Test
        run: ctest --test-dir build/markers --output-on-failure
